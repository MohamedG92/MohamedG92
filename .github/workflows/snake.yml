name: Purple contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-purple.svg?color_snake=#c084fc&color_dots=#1e0b33,#3b0764,#6b21a8,#9333ea,#c084fc&color_background=#13071f

      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
